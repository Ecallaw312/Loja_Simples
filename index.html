<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>SedLex</h1>
      <p>Controle de produtos</p>
    </header>

    <main>
      <section class="cartao">
        <h2>Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 10" required />

          <button type="submit" id="botao-formulario">Adicionar produto</button>
          <p id="mensagem-validacao" class="mensagem-erro" role="alert"></p>
        </form>
      </section>

      <section class="cartao">
        <h2>Produtos cadastrados: <span id="contador-produtos">0</span></h2>
        <p id="mensagem-vazia" class="mensagem-vazia">Nenhum produto cadastrado.</p>
        <ul id="lista-produtos"></ul>
      </section>
    </main>
    <footer>
      <p>&copy; 2023 Loja Simples. Todos os direitos reservados.</p>  
    </footer>
    <script src="script.js"></script>
  </body>
</html>
